# Canopy plugin manifest. The release workflow sets `version` from the tag and publishes this
# file next to the binaries and SHA256SUMS.
id: dapple
name: { en: Cast to a screen, fr: Diffuser sur un écran, es: Enviar a una pantalla }
description:
  en: Plays a video on a TV or screen of the network (Chromecast, Google TV, Apple TV, DLNA smart TVs) and controls playback.
  fr: Lit une vidéo sur une TV ou un écran du réseau (Chromecast, Google TV, Apple TV, TV connectées DLNA) et pilote la lecture.
  es: Reproduce un vídeo en un televisor o pantalla de la red (Chromecast, Google TV, Apple TV, televisores DLNA) y controla la reproducción.
version: 0.0.0
binary: dapple
# Plugins get a data folder (pairings, conversions) from this Canopy version.
minCanopy: 2026.11.10
source:
  repo: AlexArtaud-Dev/dapple
  checksums: SHA256SUMS
  assets:
    linux-amd64: dapple-linux-amd64
    linux-arm64: dapple-linux-arm64
# Screens Canopy keeps: found by dapple.devices, paired (Apple TV) by dapple.pair and
# dapple.pair-code, picked by name in every field marked `device: screen`.
devices:
  - kind: screen
    name: { en: Screens, fr: Écrans, es: Pantallas }
    detect: dapple.devices
    pair: { start: dapple.pair, code: dapple.pair-code }
commands:
  - id: dapple.devices
    name: { en: Find screens, fr: Chercher les écrans, es: Buscar pantallas }
    description:
      en: Lists the screens found on the network, each with the locator that reaches it. In a container, a dapple relay on the host is asked.
      fr: Liste les écrans trouvés sur le réseau, chacun avec le localisateur qui l’atteint. Dans un container, un relais dapple sur l’hôte est interrogé.
      es: Lista las pantallas encontradas en la red, cada una con el localizador que la alcanza. En un contenedor, se consulta un relé dapple en el anfitrión.
    binary: dapple
    mode: basic
    params:
      - name: timeout
        type: int
        min: 1
        max: 30
        default: 4
        label: { en: Search time (seconds), fr: Durée de recherche (secondes), es: Tiempo de búsqueda (segundos) }
      - name: relay
        type: string
        pattern: '[A-Za-z0-9][A-Za-z0-9.:-]{0,252}'
        flag: '--relay={value}'
        label:
          {
            en: 'Relay address (when screens are not found)',
            fr: 'Adresse du relais (si les écrans ne sont pas trouvés)',
            es: 'Dirección del relé (si no se encuentran pantallas)',
          }
    # One `locator<TAB>name<TAB>type=…;model=…;pairing=needed` line per screen: what Canopy reads.
    args: ['devices', '--choices', '--timeout={timeout}', '{flags}']
    progressParser: none
    timeout: 2m

  - id: dapple.cast
    name: { en: Cast a video, fr: Diffuser une vidéo, es: Enviar un vídeo }
    description:
      en: Plays the video on the chosen screen until it ends. Cancel the operation to stop playback. What the screen cannot play is converted on the fly when ffmpeg is installed.
      fr: Lit la vidéo sur l’écran choisi jusqu’à la fin. Annulez l’opération pour arrêter la lecture. Ce que l’écran ne lit pas est converti à la volée si ffmpeg est installé.
      es: Reproduce el vídeo en la pantalla elegida hasta el final. Cancele la operación para detener la reproducción. Lo que la pantalla no reproduce se convierte al vuelo si ffmpeg está instalado.
    binary: dapple
    mode: basic
    params:
      - name: file
        type: path
        access: read
        # Offered in the file browser when a video or a piece of music is right-clicked.
        on: file
        extensions: [mkv, mp4, m4v, webm, avi, mov, ts, m2ts, mts, mpg, mpeg, wmv, flv, mp3, flac, m4a, ogg, opus, wav]
        required: true
        label: { en: Video, fr: Vidéo, es: Vídeo }
      - name: device
        type: string
        required: true
        pattern: '[^-].{0,199}'
        # Picked among the screens Canopy keeps (see devices above).
        device: screen
        label: { en: Screen, fr: Écran, es: Pantalla }
      - name: subtitles
        advanced: true
        on: file
        extensions: [srt, vtt]
        help:
          en: 'An .srt or .vtt file shown over the video.'
          fr: 'Un fichier .srt ou .vtt affiché sur la vidéo.'
          es: 'Un archivo .srt o .vtt mostrado sobre el vídeo.'
        type: path
        access: read
        flag: '--subtitles={value}'
        label: { en: Subtitles (.srt or .vtt), fr: Sous-titres (.srt ou .vtt), es: Subtítulos (.srt o .vtt) }
      - name: start
        advanced: true
        help:
          en: 'Where playback starts: 90, 12:30 or 1:02:03.'
          fr: 'Où la lecture commence : 90, 12:30 ou 1:02:03.'
          es: 'Dónde empieza la reproducción: 90, 12:30 o 1:02:03.'
        type: string
        pattern: '[0-9]{1,2}(:[0-9]{2}){0,2}'
        flag: '--start={value}'
        label: { en: 'Start at (1:02:03)', fr: 'Démarrer à (1:02:03)', es: 'Empezar en (1:02:03)' }
      - name: audio
        advanced: true
        help:
          en: 'The audio track to play when the video has several. Choosing one converts the video.'
          fr: 'La piste audio à lire quand la vidéo en a plusieurs. En choisir une convertit la vidéo.'
          es: 'La pista de audio que se reproduce cuando el vídeo tiene varias. Elegir una convierte el vídeo.'
        type: int
        min: 0
        max: 31
        flag: '--audio={value}'
        label: { en: Audio track (from 0), fr: Piste audio (à partir de 0), es: Pista de audio (desde 0) }
      - name: transcode
        advanced: true
        help:
          en: 'When needed: only what the screen cannot play is converted. Always: for a TV that refuses a file without saying why.'
          fr: 'Si nécessaire : seul ce que l’écran ne lit pas est converti. Toujours : pour une TV qui refuse un fichier sans dire pourquoi.'
          es: 'Si es necesario: solo se convierte lo que la pantalla no reproduce. Siempre: para un televisor que rechaza un archivo sin decir por qué.'
        type: enum
        default: auto
        flag: '--transcode={value}'
        label: { en: Conversion, fr: Conversion, es: Conversión }
        choices:
          - { value: auto, label: { en: When needed, fr: Si nécessaire, es: Si es necesario } }
          - { value: always, label: { en: Always, fr: Toujours, es: Siempre } }
          - { value: never, label: { en: Never, fr: Jamais, es: Nunca } }
      - name: volume
        advanced: true
        help:
          en: 'The volume the screen is set to before playing. Empty keeps its current volume.'
          fr: 'Le volume réglé sur l’écran avant la lecture. Vide, il garde son volume actuel.'
          es: 'El volumen fijado en la pantalla antes de reproducir. Vacío, conserva su volumen actual.'
        type: int
        min: 0
        max: 100
        flag: '--volume={value}'
        label: { en: Volume (0-100), fr: Volume (0-100), es: Volumen (0-100) }
      - name: host
        advanced: true
        help:
          en: 'The address of the machine running Canopy, as the screen sees it. Leave it empty: it is found by itself when a dapple relay runs.'
          fr: 'L’adresse de la machine qui fait tourner Canopy, vue depuis l’écran. Laissez vide : elle est trouvée seule quand un relais dapple tourne.'
          es: 'La dirección de la máquina que ejecuta Canopy, vista desde la pantalla. Déjela vacía: se encuentra sola cuando funciona un relé dapple.'
        type: string
        pattern: '[A-Za-z0-9][A-Za-z0-9.-]{0,252}'
        flag: '--host={value}'
        label:
          {
            en: 'Address the screen uses to reach Canopy (found by itself with a relay)',
            fr: 'Adresse par laquelle l’écran joint Canopy (trouvée seule avec un relais)',
            es: 'Dirección con la que la pantalla alcanza Canopy (hallada sola con un relé)',
          }
      - name: port
        advanced: true
        help:
          en: 'The port the screen fetches the video from: the one Canopy''s compose file publishes for casting.'
          fr: 'Le port où l’écran récupère la vidéo : celui que le fichier compose de Canopy publie pour la diffusion.'
          es: 'El puerto donde la pantalla obtiene el vídeo: el que el archivo compose de Canopy publica para el envío.'
        type: int
        min: 1
        max: 65535
        # The port Canopy's compose file publishes for casting.
        default: 8690
        flag: '--port={value}'
        label: { en: Media server port, fr: Port du serveur de médias, es: Puerto del servidor de medios }
    args: ['cast', '{flags}', '--plain', '--to', '{device}', '--', '{file}']
    progressParser: percent-regex
    progressPattern: '^(?P<percent>[0-9]{1,3})% '
    timeout: 12h

  - id: dapple.status
    name: { en: Playback status, fr: État de la lecture, es: Estado de la reproducción }
    description:
      en: Shows what the screen is doing and where it is in the video.
      fr: Affiche ce que fait l’écran et où il en est dans la vidéo.
      es: Muestra lo que hace la pantalla y por dónde va el vídeo.
    binary: dapple
    mode: basic
    params:
      - &device
        name: device
        type: string
        required: true
        pattern: '[^-].{0,199}'
        device: screen
        label: { en: Screen, fr: Écran, es: Pantalla }
    args: ['status', '--to', '{device}']
    progressParser: none
    timeout: 2m

  - id: dapple.pair
    # Reached from the Pair button wherever a screen asks for it.
    secondary: true
    name: { en: Pair an Apple TV, fr: Jumeler un Apple TV, es: Emparejar un Apple TV }
    description:
      en: Apple TVs and AirPlay screens ask for a pairing, once. This shows a code on the screen and waits five minutes for it - enter it with "Enter the pairing code".
      fr: Les Apple TV et écrans AirPlay demandent un jumelage, une seule fois. Ceci affiche un code sur l’écran et l’attend cinq minutes - saisissez-le avec « Saisir le code de jumelage ».
      es: Los Apple TV y pantallas AirPlay piden un emparejamiento, una sola vez. Esto muestra un código en la pantalla y lo espera cinco minutos - introdúzcalo con «Introducir el código de emparejamiento».
    binary: dapple
    mode: basic
    params: [*device]
    args: ['pair', '--to', '{device}']
    progressParser: none
    timeout: 6m

  - id: dapple.pair-code
    # Reached from the Pair button wherever a screen asks for it.
    secondary: true
    name:
      {
        en: Enter the pairing code,
        fr: Saisir le code de jumelage,
        es: Introducir el código de emparejamiento,
      }
    description:
      en: Hands the code shown on the screen to the pairing that waits for it.
      fr: Transmet le code affiché sur l’écran au jumelage qui l’attend.
      es: Entrega el código mostrado en la pantalla al emparejamiento que lo espera.
    binary: dapple
    mode: basic
    params:
      - name: code
        type: string
        required: true
        pattern: '[0-9]{4,8}'
        label: { en: Code shown on the screen, fr: Code affiché sur l’écran, es: Código mostrado en la pantalla }
    args: ['pair', '--code', '{code}']
    progressParser: none
    timeout: 1m

  - id: dapple.pause
    name: { en: Pause, fr: Mettre en pause, es: Pausar }
    description:
      en: Pauses what the screen is playing.
      fr: Met en pause ce que l’écran lit.
      es: Pausa lo que la pantalla reproduce.
    binary: dapple
    mode: basic
    params: [*device]
    args: ['pause', '--to', '{device}']
    progressParser: none
    timeout: 2m

  - id: dapple.resume
    name: { en: Resume, fr: Reprendre, es: Reanudar }
    description:
      en: Resumes playback on the screen.
      fr: Reprend la lecture sur l’écran.
      es: Reanuda la reproducción en la pantalla.
    binary: dapple
    mode: basic
    params: [*device]
    args: ['resume', '--to', '{device}']
    progressParser: none
    timeout: 2m

  - id: dapple.stop
    name: { en: Stop, fr: Arrêter, es: Detener }
    description:
      en: Stops playback on the screen.
      fr: Arrête la lecture sur l’écran.
      es: Detiene la reproducción en la pantalla.
    binary: dapple
    mode: basic
    params: [*device]
    args: ['stop', '--to', '{device}']
    progressParser: none
    timeout: 2m

  - id: dapple.seek
    name: { en: Jump to a position, fr: Aller à une position, es: Ir a una posición }
    description:
      en: Jumps to a position of the video being played. A video converted on the fly cannot be jumped in this way.
      fr: Va à une position de la vidéo en cours. Une vidéo convertie à la volée ne peut pas être déplacée ainsi.
      es: Va a una posición del vídeo en curso. Un vídeo convertido al vuelo no admite este salto.
    binary: dapple
    mode: basic
    params:
      - *device
      - name: position
        type: string
        required: true
        pattern: '[0-9]{1,2}(:[0-9]{2}){0,2}'
        label: { en: 'Position (1:02:03)', fr: 'Position (1:02:03)', es: 'Posición (1:02:03)' }
    args: ['seek', '{position}', '--to', '{device}']
    progressParser: none
    timeout: 2m

  - id: dapple.volume
    name: { en: Set the volume, fr: Régler le volume, es: Ajustar el volumen }
    description:
      en: Sets the volume of the screen.
      fr: Règle le volume de l’écran.
      es: Ajusta el volumen de la pantalla.
    binary: dapple
    mode: basic
    params:
      - *device
      - name: level
        type: int
        min: 0
        max: 100
        required: true
        label: { en: Volume (0-100), fr: Volume (0-100), es: Volumen (0-100) }
    args: ['volume', '{level}', '--to', '{device}']
    progressParser: none
    timeout: 2m
