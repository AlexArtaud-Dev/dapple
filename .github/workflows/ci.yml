name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Static Linux binaries (musl) for both architectures from one runner.
      - if: matrix.zig
        run: pip install cargo-zigbuild
      - if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          binary="target/${{ matrix.target }}/release/dapple"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$binary.exe" dist/dapple-${{ matrix.name }}.exe
          else
            cp "$binary" dist/dapple-${{ matrix.name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dapple-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  image:
    name: Docker image
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dapple-linux-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # Only a release tag names a version; other builds (branches, pull requests, whose ref
          # is "5/merge") are tagged for the build alone and never pushed.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "list=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "list=$image:ci" >> "$GITHUB_OUTPUT"
          fi
      # Built on every push so that a broken image is seen before a release; pushed on tags.
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Cast local video files to the screens of your network; runs the discovery relay by default
            org.opencontainers.image.licenses=MIT

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the binaries: the image job leaves a build record among the artifacts.
          pattern: dapple-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum dapple-* > SHA256SUMS
      # Canopy installs the plugin from this manifest: it must carry the released version.
      - name: Canopy plugin manifest
        run: |
          sed "s/^version: .*/version: ${GITHUB_REF_NAME#v}/" canopy-plugin.yaml > dist/canopy-plugin.yaml
          grep -q "^version: ${GITHUB_REF_NAME#v}$" dist/canopy-plugin.yaml
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
